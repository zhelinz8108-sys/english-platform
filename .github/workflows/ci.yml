name: quality-gates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      - name: Start integration dependencies
        run: |
          cp .env.example .env
          for attempt in 1 2 3 4; do
            if docker compose pull postgres redis minio minio-init; then
              break
            fi
            if test "$attempt" -eq 4; then
              exit 1
            fi
            sleep "$((attempt * 10))"
          done
          docker compose up -d --no-build postgres redis minio minio-init

      - name: Migrate and seed
        run: |
          pnpm db:migrate
          pnpm db:seed

      - name: Start API and Worker
        run: |
          node --env-file=.env apps/api/dist/main.js > api.log 2>&1 &
          echo $! > api.pid
          node --env-file=.env apps/worker/dist/main.js > worker.log 2>&1 &
          echo $! > worker.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4000/health/ready >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat api.log
          exit 1

      - run: pnpm test:security
      - run: pnpm test:e2e
      - run: pnpm test:performance

      - name: Print service logs on failure
        if: failure()
        run: |
          cat api.log || true
          cat worker.log || true
          docker compose logs --tail=200 || true

      - name: Stop integration stack
        if: always()
        run: |
          if test -f api.pid; then kill $(cat api.pid) || true; fi
          if test -f worker.pid; then kill $(cat worker.pid) || true; fi
          docker compose down -v

  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Configure pinned SSH access
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_USER: ${{ secrets.ECS_USER }}
          ECS_SSH_PRIVATE_KEY: ${{ secrets.ECS_SSH_PRIVATE_KEY }}
          ECS_KNOWN_HOSTS: ${{ secrets.ECS_KNOWN_HOSTS }}
          ECS_ENV_FILE_B64: ${{ secrets.ECS_ENV_FILE_B64 }}
        run: |
          set -euo pipefail
          test -n "$ECS_HOST"
          test -n "$ECS_USER"
          test -n "$ECS_SSH_PRIVATE_KEY"
          test -n "$ECS_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ECS_SSH_PRIVATE_KEY" > ~/.ssh/production_deploy_key
          printf '%s\n' "$ECS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/production_deploy_key ~/.ssh/known_hosts
          if test -n "$ECS_ENV_FILE_B64"; then
            printf '%s' "$ECS_ENV_FILE_B64" | base64 --decode > ~/.ssh/production.env
            chmod 600 ~/.ssh/production.env
          fi

      - name: Create immutable release archive
        run: |
          set -euo pipefail
          node_digest='sha256:7fddd9ddeae8196abf4a3ef2de34e11f7b1a722119f91f28ddf1e99dcafdf114'
          for attempt in 1 2 3 4; do
            if docker pull "node@${node_digest}"; then
              break
            fi
            if test "$attempt" -eq 4; then
              exit 1
            fi
            sleep "$((attempt * 10))"
          done
          docker tag "node@${node_digest}" node:24.14.0-alpine
          docker save node:24.14.0-alpine | gzip -1 > /tmp/node-24.14.0-alpine.tar.gz
          tar \
            --create \
            --gzip \
            --file="/tmp/english-platform-${GITHUB_SHA}.tar.gz" \
            --exclude=.git \
            --exclude=node_modules \
            --exclude='*/node_modules' \
            --exclude=.next \
            --exclude='*/.next' \
            --exclude=tmp \
            --exclude=output \
            --exclude=outputs \
            --exclude=coverage \
            --exclude=source \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='*.log' \
            --exclude='*.zip' \
            --exclude='*.tar.gz' \
            .

      - name: Upload and release on ECS
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_USER: ${{ secrets.ECS_USER }}
        run: |
          set -euo pipefail
          ssh_options=(
            -i "$HOME/.ssh/production_deploy_key"
            -o IdentitiesOnly=yes
            -o "UserKnownHostsFile=$HOME/.ssh/known_hosts"
            -o StrictHostKeyChecking=yes
            -o ConnectTimeout=30
            -o ConnectionAttempts=3
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=20
            -o TCPKeepAlive=yes
          )
          target="${ECS_USER}@${ECS_HOST}"
          archive="/tmp/english-platform-${GITHUB_SHA}.tar.gz"
          remote_archive="/opt/english-platform/releases/${GITHUB_SHA}.tar.gz"
          node_base="/tmp/node-24.14.0-alpine.tar.gz"
          remote_node_base="/opt/english-platform/releases/node-24.14.0-alpine.tar.gz"
          ssh "${ssh_options[@]}" "$target" \
            'docker image prune --all --force && docker builder prune --all --force'
          ssh "${ssh_options[@]}" "$target" 'mkdir -p /opt/english-platform/releases'
          scp "${ssh_options[@]}" "$node_base" "$target:$remote_node_base"
          ssh "${ssh_options[@]}" "$target" \
            "docker load --input '$remote_node_base' && rm -f '$remote_node_base'"
          if test -s "$HOME/.ssh/production.env"; then
            scp "${ssh_options[@]}" "$HOME/.ssh/production.env" \
              "$target:/opt/english-platform/shared/.env.ecs.next"
            ssh "${ssh_options[@]}" "$target" \
              'install -m 600 /opt/english-platform/shared/.env.ecs.next /opt/english-platform/shared/.env.ecs && rm -f /opt/english-platform/shared/.env.ecs.next'
          fi
          scp "${ssh_options[@]}" "$archive" "$target:$remote_archive"
          ssh "${ssh_options[@]}" "$target" \
            "RELEASE_ID='${GITHUB_SHA}' ARCHIVE_PATH='$remote_archive' ENV_FILE='/opt/english-platform/shared/.env.ecs' bash -s" \
            < deploy/alibaba-cloud/release-on-ecs.sh
